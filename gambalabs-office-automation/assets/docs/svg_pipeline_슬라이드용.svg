<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="854" viewBox="0 0 1920 854" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#8A97A8"/>
    </marker>
    <marker id="arLoop" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#D2762B"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#123979" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ── 입력 ───────────────────────────────────────────── -->
  <rect x="70" y="238" width="180" height="152" rx="10" fill="#F2F5FA" stroke="#C6D0DE" stroke-width="1.5"/>
  <text x="160" y="292" font-size="27" font-weight="bold" fill="#123979" text-anchor="middle">입력 이미지</text>
  <text x="160" y="330" font-size="22" fill="#5A6472" text-anchor="middle">PNG · JPG</text>
  <text x="160" y="360" font-size="22" fill="#5A6472" text-anchor="middle">HEIC · AVIF</text>
  <line x1="260" y1="314" x2="282" y2="314" stroke="#8A97A8" stroke-width="3" marker-end="url(#ar)"/>

  <!-- ── ① rembg ────────────────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="290" y="110" width="400" height="400" rx="12" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1.5"/>
    <path d="M290 122 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v72 h-400 z" fill="#2E6FB7"/>
  </g>
  <circle cx="328" cy="152" r="18" fill="#FFFFFF" fill-opacity="0.22"/>
  <text x="328" y="161" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="360" y="152" font-size="40" font-weight="bold" fill="#FFFFFF">rembg</text>
  <text x="360" y="180" font-size="21" fill="#D6E4F5">배경 제거 · 선택 단계</text>
  <text x="322" y="248" font-size="28" font-weight="bold" fill="#123979">피사체만 남기기</text>
  <line x1="322" y1="268" x2="658" y2="268" stroke="#E4E9F0" stroke-width="1.5"/>
  <text x="322" y="316" font-size="25" fill="#3C4756">• U²-Net 세그멘테이션</text>
  <text x="322" y="366" font-size="25" fill="#3C4756">• 반투명 경계 자체 보정</text>
  <text x="344" y="400" font-size="21" fill="#8A97A8">검은 윤곽선 방지</text>
  <rect x="322" y="440" width="230" height="38" rx="19" fill="#EDF3FA"/>
  <text x="437" y="466" font-size="21" fill="#2E6FB7" text-anchor="middle">Python · ONNX</text>
  <line x1="700" y1="314" x2="722" y2="314" stroke="#8A97A8" stroke-width="3" marker-end="url(#ar)"/>

  <!-- ── ② vtracer (핵심) ───────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="730" y="98" width="450" height="424" rx="12" fill="#FFFFFF" stroke="#0038A3" stroke-width="3"/>
    <path d="M730 110 a12 12 0 0 1 12 -12 h426 a12 12 0 0 1 12 12 v74 h-450 z" fill="#0038A3"/>
  </g>
  <circle cx="769" cy="142" r="18" fill="#FFFFFF" fill-opacity="0.22"/>
  <text x="769" y="151" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="801" y="142" font-size="42" font-weight="bold" fill="#FFFFFF">vtracer</text>
  <text x="801" y="170" font-size="21" fill="#CBDBF5">visioncortex · 변환 엔진</text>
  <rect x="1078" y="114" width="80" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.24"/>
  <text x="1118" y="136" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">핵심</text>
  <text x="764" y="248" font-size="28" font-weight="bold" fill="#123979">래스터 → 벡터 경로 추출</text>
  <line x1="764" y1="268" x2="1146" y2="268" stroke="#E4E9F0" stroke-width="1.5"/>
  <text x="764" y="316" font-size="25" fill="#3C4756">• 색 레이어별 곡선 경로화</text>
  <text x="764" y="366" font-size="25" fill="#3C4756">• 유형별 파라미터 자체 지정</text>
  <text x="764" y="416" font-size="25" fill="#3C4756">• 별도 프로세스 → 즉시 취소</text>
  <rect x="764" y="450" width="272" height="38" rx="19" fill="#EBF0FA"/>
  <text x="900" y="476" font-size="21" fill="#0038A3" text-anchor="middle">Rust · Python 바인딩</text>
  <line x1="1190" y1="314" x2="1212" y2="314" stroke="#8A97A8" stroke-width="3" marker-end="url(#ar)"/>

  <!-- ── ③ resvg ────────────────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="1220" y="110" width="400" height="400" rx="12" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1.5"/>
    <path d="M1220 122 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v72 h-400 z" fill="#4A8FD4"/>
  </g>
  <circle cx="1258" cy="152" r="18" fill="#FFFFFF" fill-opacity="0.22"/>
  <text x="1258" y="161" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1290" y="152" font-size="40" font-weight="bold" fill="#FFFFFF">resvg</text>
  <text x="1290" y="180" font-size="21" fill="#E1EDFA">품질 검증 · 채점</text>
  <text x="1252" y="248" font-size="28" font-weight="bold" fill="#123979">원본과 비교해 채점</text>
  <line x1="1252" y1="268" x2="1588" y2="268" stroke="#E4E9F0" stroke-width="1.5"/>
  <text x="1252" y="316" font-size="25" fill="#3C4756">• SVG를 다시 PNG로 렌더</text>
  <text x="1252" y="366" font-size="25" fill="#3C4756">• SSIM + 획 보존율 측정</text>
  <text x="1274" y="400" font-size="21" fill="#8A97A8">글자 실종을 잡기 위해</text>
  <rect x="1252" y="440" width="252" height="38" rx="19" fill="#EEF4FB"/>
  <text x="1378" y="466" font-size="21" fill="#3B7CBF" text-anchor="middle">Rust · Node 바인딩</text>
  <line x1="1630" y1="314" x2="1652" y2="314" stroke="#8A97A8" stroke-width="3" marker-end="url(#ar)"/>

  <!-- ── 출력 ───────────────────────────────────────────── -->
  <rect x="1660" y="228" width="190" height="172" rx="10" fill="#123979"/>
  <text x="1755" y="288" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">최적안 SVG</text>
  <line x1="1690" y1="310" x2="1820" y2="310" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="1755" y="348" font-size="22" fill="#C9D6EC" text-anchor="middle">해상도</text>
  <text x="1755" y="378" font-size="22" fill="#C9D6EC" text-anchor="middle">무손실</text>

  <!-- ── 자동 튜닝 루프 ─────────────────────────────────── -->
  <path d="M1420 510 V 556 H 955 V 522" fill="none" stroke="#D2762B" stroke-width="3"
        stroke-dasharray="10 7" marker-end="url(#arLoop)"/>
  <rect x="906" y="576" width="568" height="50" rx="25" fill="#FDF3E9" stroke="#EBC49A" stroke-width="2"/>
  <text x="1190" y="609" font-size="25" font-weight="bold" fill="#B45F17" text-anchor="middle">자동 튜닝 — 후보 3~4개를 실제로 변환·채점</text>

  <!-- ── 자체 구현 계층 ─────────────────────────────────── -->
  <rect x="70" y="666" width="1780" height="124" rx="12" fill="#F5F8FC" stroke="#DCE4EF" stroke-width="1.5"/>
  <rect x="70" y="666" width="8" height="124" rx="4" fill="#123979"/>
  <text x="102" y="706" font-size="26" font-weight="bold" fill="#123979">자체 구현<tspan dx="14" font-weight="normal" font-size="23" fill="#5A6472">— 세 레포는 각 단계의 엔진일 뿐, 무엇을 어떻게 시도하고 무엇을 채택할지는 자체 코드가 정한다</tspan></text>

  <g font-size="23" font-weight="bold" fill="#0038A3" text-anchor="middle">
    <rect x="102" y="724" width="340" height="48" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="272" y="755">유형 자동 분류</text>
    <rect x="462" y="724" width="340" height="48" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="632" y="755">유형별 전처리</text>
    <rect x="822" y="724" width="340" height="48" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="992" y="755">후보 파라미터 생성</text>
    <rect x="1182" y="724" width="340" height="48" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="1352" y="755">점수 비교 · 채택</text>
    <rect x="1542" y="724" width="286" height="48" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="1685" y="755">프로세스 격리</text>
  </g>
</svg>
