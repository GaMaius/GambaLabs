  <rect x="630" y="51" width="150" height="50" rx="25" fill="#FFFFFF" stroke="#123979" stroke-width="2"/>
  <text x="705" y="83" font-size="22" font-weight="bold" fill="#123979" text-anchor="middle">PPT</text>
  <rect x="800" y="51" width="150" height="50" rx="25" fill="#FFFFFF" stroke="#2A9D99" stroke-width="2"/>
  <text x="875" y="83" font-size="22" font-weight="bold" fill="#22857F" text-anchor="middle">Excel</text>
