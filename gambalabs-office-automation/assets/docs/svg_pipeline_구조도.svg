<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#8A97A8"/>
    </marker>
    <marker id="arLoop" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#D2762B"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#123979" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ── 헤더 ───────────────────────────────────────────── -->
  <rect x="80" y="72" width="7" height="76" fill="#0038A3"/>
  <text x="110" y="112" font-size="42" font-weight="bold" fill="#123979">SVG 벡터 변환 — 오픈소스 3개 조합 구조</text>
  <text x="112" y="150" font-size="21" fill="#5A6472">검증된 오픈소스가 각 단계를 맡고, 자체 코드가 이를 묶어 <tspan font-weight="bold" fill="#123979">후보를 실제로 돌려보고 가장 좋은 결과를 고른다</tspan></text>

  <!-- ── 입력 ───────────────────────────────────────────── -->
  <rect x="80" y="380" width="196" height="150" rx="10" fill="#F2F5FA" stroke="#C6D0DE" stroke-width="1.5"/>
  <text x="178" y="428" font-size="21" font-weight="bold" fill="#123979" text-anchor="middle">입력 이미지</text>
  <text x="178" y="462" font-size="16" fill="#5A6472" text-anchor="middle">PNG · JPG · WebP</text>
  <text x="178" y="486" font-size="16" fill="#5A6472" text-anchor="middle">HEIC · AVIF</text>
  <text x="178" y="512" font-size="15" fill="#8A97A8" text-anchor="middle">비트맵 (해상도 고정)</text>
  <line x1="286" y1="455" x2="308" y2="455" stroke="#8A97A8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ── ① rembg ────────────────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="322" y="300" width="368" height="310" rx="12" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1.5"/>
    <path d="M322 312 a12 12 0 0 1 12 -12 h344 a12 12 0 0 1 12 12 v52 h-368 z" fill="#2E6FB7"/>
  </g>
  <circle cx="356" cy="338" r="15" fill="#FFFFFF" fill-opacity="0.22"/>
  <text x="356" y="345" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="384" y="338" font-size="24" font-weight="bold" fill="#FFFFFF">rembg</text>
  <text x="384" y="357" font-size="14" fill="#D6E4F5">배경 제거 · 선택 단계</text>
  <text x="352" y="410" font-size="19" font-weight="bold" fill="#123979">피사체만 남기고 투명 처리</text>
  <line x1="352" y1="428" x2="660" y2="428" stroke="#E4E9F0" stroke-width="1.5"/>
  <text x="352" y="459" font-size="16" fill="#3C4756">• U²-Net(u2netp) 세그멘테이션</text>
  <text x="352" y="487" font-size="16" fill="#3C4756">• 배경 픽셀을 알파 0으로</text>
  <text x="352" y="515" font-size="16" fill="#3C4756">• 반투명 경계는 자체 보정</text>
  <text x="368" y="540" font-size="15" fill="#8A97A8">(defringe — 검은 윤곽 방지)</text>
  <rect x="352" y="558" width="176" height="26" rx="13" fill="#EDF3FA"/>
  <text x="440" y="576" font-size="14" fill="#2E6FB7" text-anchor="middle">Python · ONNX Runtime</text>
  <line x1="700" y1="455" x2="742" y2="455" stroke="#8A97A8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ── ② vtracer (핵심) ───────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="756" y="286" width="380" height="338" rx="12" fill="#FFFFFF" stroke="#0038A3" stroke-width="2.5"/>
    <path d="M756 298 a12 12 0 0 1 12 -12 h356 a12 12 0 0 1 12 12 v56 h-380 z" fill="#0038A3"/>
  </g>
  <circle cx="791" cy="326" r="15" fill="#FFFFFF" fill-opacity="0.22"/>
  <text x="791" y="333" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="819" y="326" font-size="26" font-weight="bold" fill="#FFFFFF">vtracer</text>
  <text x="819" y="346" font-size="14" fill="#CBDBF5">visioncortex · 변환 엔진</text>
  <rect x="1052" y="300" width="70" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.22"/>
  <text x="1087" y="317" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">핵심</text>
  <text x="786" y="402" font-size="19" font-weight="bold" fill="#123979">래스터 → 벡터 경로 추출</text>
  <line x1="786" y1="420" x2="1106" y2="420" stroke="#E4E9F0" stroke-width="1.5"/>
  <text x="786" y="451" font-size="16" fill="#3C4756">• 색 레이어별로 윤곽을 따내</text>
  <text x="802" y="475" font-size="16" fill="#3C4756">곡선(spline) 경로로 변환</text>
  <text x="786" y="505" font-size="16" fill="#3C4756">• 유형별 파라미터를 자체 지정</text>
  <text x="802" y="529" font-size="15" fill="#8A97A8">filter_speckle · length_threshold …</text>
  <text x="786" y="559" font-size="16" fill="#3C4756">• 별도 프로세스 실행</text>
  <text x="802" y="583" font-size="15" fill="#8A97A8">→ 중지 버튼으로 즉시 취소</text>
  <rect x="786" y="596" width="158" height="20" rx="10" fill="#EBF0FA"/>
  <text x="865" y="611" font-size="13" fill="#0038A3" text-anchor="middle">Rust · Python 바인딩</text>
  <line x1="1146" y1="455" x2="1188" y2="455" stroke="#8A97A8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ── ③ resvg ────────────────────────────────────────── -->
  <g filter="url(#sh)">
    <rect x="1202" y="300" width="368" height="310" rx="12" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1.5"/>
    <path d="M1202 312 a12 12 0 0 1 12 -12 h344 a12 12 0 0 1 12 12 v52 h-368 z" fill="#4A8FD4"/>
  </g>
  <circle cx="1236" cy="338" r="15" fill="#FFFFFF" fill-opacity="0.22"/>
  <text x="1236" y="345" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1264" y="338" font-size="24" font-weight="bold" fill="#FFFFFF">resvg</text>
  <text x="1264" y="357" font-size="14" fill="#E1EDFA">품질 검증 · 채점</text>
  <text x="1232" y="410" font-size="19" font-weight="bold" fill="#123979">다시 렌더해 원본과 비교</text>
  <line x1="1232" y1="428" x2="1540" y2="428" stroke="#E4E9F0" stroke-width="1.5"/>
  <text x="1232" y="459" font-size="16" fill="#3C4756">• 결과 SVG를 다시 PNG로 렌더</text>
  <text x="1232" y="487" font-size="16" fill="#3C4756">• SSIM + 획 보존 F1 로 채점</text>
  <text x="1248" y="512" font-size="15" fill="#8A97A8">글자 실종을 픽셀 지표가 못 잡아</text>
  <text x="1248" y="534" font-size="15" fill="#8A97A8">획 덩어리 단위로 함께 측정</text>
  <rect x="1232" y="552" width="168" height="26" rx="13" fill="#EEF4FB"/>
  <text x="1316" y="570" font-size="14" fill="#3B7CBF" text-anchor="middle">Rust · Node 바인딩</text>
  <line x1="1580" y1="455" x2="1616" y2="455" stroke="#8A97A8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ── 출력 ───────────────────────────────────────────── -->
  <rect x="1630" y="370" width="210" height="170" rx="10" fill="#123979"/>
  <text x="1735" y="418" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">최적안 SVG</text>
  <line x1="1664" y1="436" x2="1806" y2="436" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="1735" y="466" font-size="16" fill="#C9D6EC" text-anchor="middle">해상도 무손실</text>
  <text x="1735" y="492" font-size="16" fill="#C9D6EC" text-anchor="middle">무손실 축소 약 7%</text>
  <text x="1735" y="520" font-size="15" fill="#93A8CC" text-anchor="middle">PPT · 문서에 바로 삽입</text>

  <!-- ── 자동 튜닝 루프 ─────────────────────────────────── -->
  <path d="M1386 610 V 664 H 946 V 624" fill="none" stroke="#D2762B" stroke-width="2.5"
        stroke-dasharray="9 6" marker-end="url(#arLoop)"/>
  <rect x="947" y="682" width="440" height="40" rx="20" fill="#FDF3E9" stroke="#EBC49A" stroke-width="1.5"/>
  <text x="1167" y="708" font-size="17" font-weight="bold" fill="#B45F17" text-anchor="middle">자동 튜닝 — 후보 3~4개를 실제로 변환·채점</text>
  <text x="1167" y="746" font-size="15" fill="#8A97A8" text-anchor="middle">점수가 가장 높은 결과를 채택 · 점수가 사실상 같으면 파일이 작은 쪽</text>

  <!-- ── 자체 구현 계층 ─────────────────────────────────── -->
  <rect x="80" y="774" width="1760" height="206" rx="12" fill="#F5F8FC" stroke="#DCE4EF" stroke-width="1.5"/>
  <rect x="80" y="774" width="7" height="206" rx="3" fill="#123979"/>
  <text x="112" y="812" font-size="23" font-weight="bold" fill="#123979">감바랩스 자체 구현 — 오케스트레이션 계층</text>
  <text x="112" y="840" font-size="16" fill="#5A6472">세 레포는 각 단계의 엔진일 뿐, "무엇을 어떤 설정으로 시도할지"와 "무엇을 채택할지"는 자체 코드가 결정한다</text>

  <g font-size="15" fill="#2B3440">
    <rect x="112" y="858" width="330" height="52" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="128" y="880" font-weight="bold" fill="#0038A3">유형 자동 분류</text>
    <text x="128" y="900" font-size="14" fill="#5A6472">lineart · diagram · logo · photo</text>

    <rect x="458" y="858" width="330" height="52" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="474" y="880" font-weight="bold" fill="#0038A3">유형별 전처리</text>
    <text x="474" y="900" font-size="14" fill="#5A6472">BICUBIC 2배 확대 · Otsu 이진화</text>

    <rect x="804" y="858" width="330" height="52" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="820" y="880" font-weight="bold" fill="#0038A3">후보 파라미터 생성</text>
    <text x="820" y="900" font-size="14" fill="#5A6472">유효 범위 강제(clamp) — 경로 붕괴 방지</text>

    <rect x="1150" y="858" width="330" height="52" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="1166" y="880" font-weight="bold" fill="#0038A3">점수 비교 · 채택</text>
    <text x="1166" y="900" font-size="14" fill="#5A6472">동률이면 용량이 작은 결과 선택</text>

    <rect x="1496" y="858" width="312" height="52" rx="8" fill="#FFFFFF" stroke="#DCE4EF"/>
    <text x="1512" y="880" font-weight="bold" fill="#0038A3">프로세스 격리</text>
    <text x="1512" y="900" font-size="14" fill="#5A6472">언제든 중지 · SVG 무손실 축소</text>
  </g>

  <text x="112" y="942" font-size="15" fill="#5A6472">측정 도구(Node·resvg)가 없는 환경에서는 점수를 표시하지 않는다 — 계산할 수 없는 값을 지어내지 않기 위해서다.</text>
  <text x="112" y="966" font-size="15" fill="#5A6472">사진은 벡터 변환 시 원본보다 용량이 커지고 디테일이 떨어지므로, 결과가 원본의 두 배를 넘으면 앱이 원본 사용을 권고한다.</text>

  <line x1="80" y1="1014" x2="1840" y2="1014" stroke="#E4E9F0" stroke-width="1.5"/>
  <text x="80" y="1042" font-size="14" fill="#8A97A8">감바랩스 오피스 AI · SVG 변환 탭 (src/vector, app/ppt/_vtrace_run.py)</text>
  <text x="1840" y="1042" font-size="14" fill="#8A97A8" text-anchor="end">rembg · vtracer · resvg</text>
</svg>
